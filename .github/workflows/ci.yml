name: Glitch CI

on:
  push:
    branches:
      - main
      - feature/glitch-core-v1-database
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: glitch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm

      - name: Repair and install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit a repaired lockfile on the development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/glitch-core-v1-database'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push
          fi

      - name: Verify clean-install reproducibility
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build production assets
        run: npm run build
